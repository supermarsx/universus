[package]
name = "backend-core"
version = "0.1.0"
edition = "2021"
authors = ["Universus <dev@local>"]
build = "build.rs"

[dependencies]
# async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# gRPC server
tonic = { version = "0.9", features = ["transport"] }
# Protobuf runtime
prost = "0.11"
prost-types = "0.11"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
# concurrent map for simple state
dashmap = "5"
# small helpers for converting mpsc::Receiver into a Stream
tokio-stream = { version = "0.1", features = ["sync"] }
# serde for embedded ship metadata
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prometheus = "0.13"
hyper = { version = "0.14", features = ["full"] }
interprocess = { version = "1.2", features = ["tokio_support"] }
axum = "0.6"
game-combat = { path = "../crates/game-combat" }
game-fleet = { path = "../crates/game-fleet" }

[build-dependencies]
tonic-build = "0.9"
protoc-bin-vendored = "3"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
