<!doctype html>
<meta charset="utf-8">
<title>Universus Planet Visual Prototype V2</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  background: #050711;
  color: #dbeaf1;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
}
.wrap {
  width: min(1180px, calc(100vw - 32px));
  padding: 28px 0;
}
.banner {
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(159, 205, 232, .20);
  background: #080b16;
}
.banner img {
  display: block;
  width: 100%;
  height: auto;
}
.caption {
  position: absolute;
  left: 32px;
  bottom: 28px;
  max-width: 560px;
  text-shadow: 0 2px 18px rgba(0,0,0,.90);
}
h1 {
  margin: 0 0 8px;
  font-size: 35px;
  letter-spacing: 0;
}
p {
  margin: 0;
  color: #bfd0d8;
}
.row {
  display: grid;
  grid-template-columns: 174px 1fr;
  align-items: center;
  gap: 20px;
  margin-top: 18px;
}
.icon {
  width: 174px;
  height: 174px;
  background: radial-gradient(circle, rgba(74,145,205,.14), transparent 65%);
}
.map {
  width: 100%;
  margin-top: 14px;
  border: 1px solid rgba(159, 205, 232, .16);
}
code {
  color: #9fd4ff;
}
</style>
<main class="wrap">
  <section class="banner" aria-label="Generated planet overview banner">
    <img src="new-terra-v2-overview-banner.png" alt="Procedurally generated overview banner for New Terra">
    <div class="caption">
      <h1>New Terra</h1>
      <p>ringed temperate ocean super-earth - G1:S120:P8 - seed <code>104372302774273</code></p>
    </div>
  </section>
  <div class="row">
    <img class="icon" src="new-terra-v2-icon.png" alt="Procedurally generated planet icon">
    <p>V2 uses layered surface maps, relief lighting, cloud shadows, ocean specular, atmosphere glow, city lights, and sharper ring bands from the same deterministic seed.</p>
  </div>
  <img class="map" src="new-terra-v2-surface-map.png" alt="Generated equirectangular surface texture map">
</main>
