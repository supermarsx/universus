<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universus - Buildings</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/game.css">
</head>
<body class="game-body">
    <nav class="top-nav">
        <div class="nav-left">
            <h1 class="nav-title">Universus</h1>
            <span id="username" class="nav-username"></span>
        </div>
        <div class="nav-center">
            <div class="resource-display">
                <div class="resource-item">
                    <span class="resource-icon metal">M</span>
                    <span id="metalDisplay">0</span>
                </div>
                <div class="resource-item">
                    <span class="resource-icon crystal">C</span>
                    <span id="crystalDisplay">0</span>
                </div>
                <div class="resource-item">
                    <span class="resource-icon deuterium">D</span>
                    <span id="deuteriumDisplay">0</span>
                </div>
                <div class="resource-item">
                    <span class="resource-icon energy">E</span>
                    <span id="energyDisplay">0</span>
                </div>
            </div>
        </div>
        <div class="nav-right">
            <button id="logoutBtn" class="btn-secondary">Logout</button>
        </div>
    </nav>

    <div class="game-container">
        <aside class="sidebar">
            <div class="planet-selector">
                <h3>Your Planets</h3>
                <select id="planetSelect" class="planet-dropdown">
                    <option>Loading...</option>
                </select>
            </div>

            <nav class="main-menu">
                <a href="overview.html" class="menu-item">Overview</a>
                <a href="buildings.html" class="menu-item active">Buildings</a>
                <a href="research.html" class="menu-item">Research</a>
                <a href="shipyard.html" class="menu-item">Shipyard</a>
                <a href="fleet.html" class="menu-item">Fleet</a>
                <a href="galaxy.html" class="menu-item">Galaxy</a>
                <a href="alliance.html" class="menu-item">Alliance</a>
                <a href="messages.html" class="menu-item">Messages</a>
            </nav>
        </aside>

        <main class="content-area">
            <h2>Buildings</h2>

            <div id="constructionQueueDisplay" class="construction-queue-display" style="display:none;">
                <h3>Construction in Progress</h3>
                <div id="activeConstruction"></div>
            </div>

            <div id="buildingsGrid" class="buildings-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading buildings...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/game.js"></script>
    <script src="/js/buildings.js"></script>
</body>
</html>
