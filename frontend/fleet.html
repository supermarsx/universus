<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet - Space Empire</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body class="game-page">
    <nav class="main-nav">
        <div class="nav-brand">Space Empire</div>
        <div class="nav-links">
            <a href="overview.html">Overview</a>
            <a href="buildings.html">Buildings</a>
            <a href="shipyard.html">Shipyard</a>
            <a href="research.html">Research</a>
            <a href="fleet.html" class="active">Fleet</a>
            <a href="galaxy.html">Galaxy</a>
            <a href="#" id="logout">Logout</a>
        </div>
    </nav>

    <main class="game-container">
        <div class="page-header">
            <h1>Fleet Management</h1>
            <div class="planet-selector">
                <select id="planet-select">
                    <option value="">Loading planets...</option>
                </select>
            </div>
        </div>

        <div class="resource-bar">
            <div class="resource-item">
                <span class="resource-icon">🔩</span>
                <span class="resource-label">Metal:</span>
                <span id="metal" class="resource-value">0</span>
            </div>
            <div class="resource-item">
                <span class="resource-icon">💎</span>
                <span class="resource-label">Crystal:</span>
                <span id="crystal" class="resource-value">0</span>
            </div>
            <div class="resource-item">
                <span class="resource-icon">⚡</span>
                <span class="resource-label">Deuterium:</span>
                <span id="deuterium" class="resource-value">0</span>
            </div>
            <div class="resource-item">
                <span class="resource-icon">🔋</span>
                <span class="resource-label">Energy:</span>
                <span id="energy" class="resource-value">0</span>
            </div>
        </div>

        <div class="content-grid">
            <!-- Fleet Dispatch Section -->
            <div class="card full-width">
                <h2>🚀 Dispatch Fleet</h2>
                <div id="dispatch-form" class="fleet-dispatch">
                    <div class="form-section">
                        <h3>Select Ships</h3>
                        <div id="ship-selection" class="ship-grid"></div>
                    </div>
                    
                    <div class="form-section">
                        <h3>Mission Details</h3>
                        <div class="mission-form">
                            <div class="form-group">
                                <label for="target-galaxy">Target Galaxy:</label>
                                <input type="number" id="target-galaxy" min="1" max="9" value="1">
                            </div>
                            <div class="form-group">
                                <label for="target-system">Target System:</label>
                                <input type="number" id="target-system" min="1" max="499" value="1">
                            </div>
                            <div class="form-group">
                                <label for="target-position">Target Position:</label>
                                <input type="number" id="target-position" min="1" max="15" value="1">
                            </div>
                            <div class="form-group">
                                <label for="mission-type">Mission Type:</label>
                                <select id="mission-type">
                                    <option value="transport">Transport</option>
                                    <option value="attack">Attack</option>
                                    <option value="deploy">Deploy</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section" id="cargo-section">
                        <h3>Cargo</h3>
                        <div class="cargo-form">
                            <div class="form-group">
                                <label for="cargo-metal">Metal:</label>
                                <input type="number" id="cargo-metal" min="0" value="0">
                            </div>
                            <div class="form-group">
                                <label for="cargo-crystal">Crystal:</label>
                                <input type="number" id="cargo-crystal" min="0" value="0">
                            </div>
                            <div class="form-group">
                                <label for="cargo-deuterium">Deuterium:</label>
                                <input type="number" id="cargo-deuterium" min="0" value="0">
                            </div>
                        </div>
                        <div class="cargo-info">
                            <span>Available Cargo Space: <strong id="available-cargo">0</strong></span>
                            <span>Fuel Consumption: <strong id="fuel-consumption">0</strong></span>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button id="dispatch-btn" class="btn btn-primary">Dispatch Fleet</button>
                        <button id="reset-btn" class="btn btn-secondary">Reset</button>
                    </div>
                </div>
            </div>

            <!-- Active Fleets Section -->
            <div class="card full-width">
                <h2>⚡ Active Fleet Missions</h2>
                <div id="active-fleets" class="fleet-list"></div>
            </div>

            <!-- Available Ships Section -->
            <div class="card full-width">
                <h2>🛸 Available Ships on Planet</h2>
                <div id="planet-ships" class="ship-list"></div>
            </div>
        </div>

        <div id="notification" class="notification"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/game.js"></script>
    <script src="js/fleet.js"></script>
</body>
</html>
