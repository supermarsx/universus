<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research - Space Empire</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body class="game-page">
    <nav class="main-nav">
        <div class="nav-brand">Space Empire</div>
        <div class="nav-links">
            <a href="overview.html">Overview</a>
            <a href="buildings.html">Buildings</a>
            <a href="shipyard.html">Shipyard</a>
            <a href="research.html" class="active">Research</a>
            <a href="fleet.html">Fleet</a>
            <a href="galaxy.html">Galaxy</a>
            <a href="#" id="logout">Logout</a>
        </div>
    </nav>

    <main class="game-container">
        <div class="page-header">
            <h1>Research Laboratory</h1>
            <div class="planet-selector">
                <select id="planet-select">
                    <option value="">Loading planets...</option>
                </select>
            </div>
        </div>

        <div class="resource-bar">
            <div class="resource-item">
                <span class="resource-icon">🔩</span>
                <span class="resource-label">Metal:</span>
                <span id="metal" class="resource-value">0</span>
            </div>
            <div class="resource-item">
                <span class="resource-icon">💎</span>
                <span class="resource-label">Crystal:</span>
                <span id="crystal" class="resource-value">0</span>
            </div>
            <div class="resource-item">
                <span class="resource-icon">⚡</span>
                <span class="resource-label">Deuterium:</span>
                <span id="deuterium" class="resource-value">0</span>
            </div>
            <div class="resource-item">
                <span class="resource-icon">🔋</span>
                <span class="resource-label">Energy:</span>
                <span id="energy" class="resource-value">0</span>
            </div>
        </div>

        <div id="research-status" class="status-section"></div>

        <div class="content-grid">
            <div class="card">
                <h2>Basic Technologies</h2>
                <div id="basic-tech" class="research-grid"></div>
            </div>

            <div class="card">
                <h2>Advanced Technologies</h2>
                <div id="advanced-tech" class="research-grid"></div>
            </div>

            <div class="card">
                <h2>Combat Technologies</h2>
                <div id="combat-tech" class="research-grid"></div>
            </div>

            <div class="card">
                <h2>Drive Technologies</h2>
                <div id="drive-tech" class="research-grid"></div>
            </div>
        </div>

        <div id="notification" class="notification"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/game.js"></script>
    <script src="js/research.js"></script>
</body>
</html>
