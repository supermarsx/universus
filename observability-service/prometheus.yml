global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  # Example: scrape backend service metrics endpoint
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8080']
  # Example: scrape node exporter
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
