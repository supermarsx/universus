syntax = "proto3";
package core;

option java_package = "com.universus.core";
option go_package = "corepb";

message BattleRequest {
  string battle_id = 1;
  repeated string player_ids = 2;
  string universe = 3;
}

message StepRequest {
  string battle_id = 1;
  string universe = 2;
}

message BattleState {
  string battle_id = 1;
  int32 tick = 2;
  string json_state = 3;
}

message SimulateRequest {
  string battle_id = 1;
  map<string,int32> attacker_ships = 2;
  map<string,int32> defender_ships = 3;
  map<string,int32> defender_defenses = 4;
  map<string,int32> attacker_tech = 5;
  map<string,int32> defender_tech = 6;
  int64 planet_metal = 7;
  int64 planet_crystal = 8;
  int64 planet_deuterium = 9;
  string seed = 10;
  string universe = 11;
}

message RoundResult {
  int32 attacker_shots = 1;
  int32 defender_shots = 2;
  int32 attacker_destroyed = 3;
  int32 defender_destroyed = 4;
}

message Loot {
  int64 metal = 1;
  int64 crystal = 2;
  int64 deuterium = 3;
}

message Debris {
  int64 metal = 1;
  int64 crystal = 2;
}

message CombatResult {
  string winner = 1;
  repeated RoundResult rounds = 2;
  map<string,int32> attacker_losses = 3;
  map<string,int32> defender_losses = 4;
  Loot loot = 5;
  Debris debris = 6;
}

message ShipMovementSpec {
  string ship_type = 1;
  int32 count = 2;
  double base_speed = 3;
  double fuel_consumption = 4;
  double cargo = 5;
}

message FleetMovementRequest {
  int32 origin_galaxy = 1;
  int32 origin_system = 2;
  int32 origin_position = 3;
  int32 target_galaxy = 4;
  int32 target_system = 5;
  int32 target_position = 6;
  repeated ShipMovementSpec ships = 7;
}

message FleetMovementResult {
  int32 distance = 1;
  double fleet_speed = 2;
  int32 travel_time_seconds = 3;
  double fuel_needed = 4;
  double cargo_capacity = 5;
}

service GameLoop {
  rpc StartBattle(BattleRequest) returns (BattleState);
  rpc StepBattle(StepRequest) returns (BattleState);
  rpc StreamBattle(StepRequest) returns (stream BattleState);
  rpc SimulateBattle(SimulateRequest) returns (CombatResult);
  rpc CalculateFleetMovement(FleetMovementRequest) returns (FleetMovementResult);
}
