version: '3.8'

services:
  database:
    build:
      context: ./database
    container_name: universus_database
    environment:
      POSTGRES_DB: universus_rpg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./redis
    container_name: universus_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    build:
      context: ./rabbitmq
    container_name: universus_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: universus
      RABBITMQ_DEFAULT_PASS: universus
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: universus_backend
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: universus_rpg
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: universus
      RABBITMQ_PASSWORD: universus
      RABBITMQ_URL: amqp://universus:universus@rabbitmq:5672
      JWT_SECRET: change_this_to_a_secure_random_string_in_production
      JWT_EXPIRES_IN: 7d
      GAME_SPEED: 1
      RESOURCE_PRODUCTION_MULTIPLIER: 1
      BOT_SERVICE_URL: http://bot-service:4001
    ports:
      - "3000:3000"
    restart: unless-stopped

  bot-service:
    build:
      context: ./bot-service
      dockerfile: Dockerfile
    container_name: universus_bot_service
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BOT_SERVICE_PORT: 4001
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: universus_rpg
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: universus
      RABBITMQ_PASSWORD: universus
      RABBITMQ_URL: amqp://universus:universus@rabbitmq:5672
      BOT_WORKER_INTERVAL_MS: 60000
      BOT_WORKER_MAX_BOTS: 25
      JWT_SECRET: change_this_to_a_secure_random_string_in_production
    ports:
      - "4001:4001"
    restart: unless-stopped

  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: universus_admin_service
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ADMIN_PORT: 4002
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: universus_rpg
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change_this_to_a_secure_random_string_in_production
    ports:
      - "4002:4002"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: universus_frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
