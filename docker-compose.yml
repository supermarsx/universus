services:
  database:
    build:
      context: ./database
    container_name: universus_database
    environment:
      POSTGRES_DB: universus_rpg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./redis
    container_name: universus_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    build:
      context: ./rabbitmq
    container_name: universus_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: universus
      RABBITMQ_DEFAULT_PASS: universus
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: universus_backend
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: universus_rpg
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: universus
      RABBITMQ_PASSWORD: universus
      RABBITMQ_URL: amqp://universus:universus@rabbitmq:5672
      JWT_SECRET: change_this_to_a_secure_random_string_in_production
      JWT_EXPIRES_IN: 7d
      GAME_SPEED: 1
      RESOURCE_PRODUCTION_MULTIPLIER: 1
      BOT_SERVICE_URL: http://bot-service:4001
    ports:
      - "3000:3000"
    restart: unless-stopped

  bot-service:
    build:
      context: ./backend-bot-service
      dockerfile: Dockerfile
    container_name: universus_bot_service
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BOT_SERVICE_PORT: 4001
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: universus_rpg
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: universus
      RABBITMQ_PASSWORD: universus
      RABBITMQ_URL: amqp://universus:universus@rabbitmq:5672
      BOT_WORKER_INTERVAL_MS: 60000
      BOT_WORKER_MAX_BOTS: 25
      JWT_SECRET: change_this_to_a_secure_random_string_in_production
    ports:
      - "4001:4001"
    restart: unless-stopped

  backend-core:
    build:
      context: ./crates/backend-core
      dockerfile: Dockerfile
    container_name: universus_backend_core
    depends_on:
      - redis
      - database
    environment:
      CORE_BIND_ADDR: 0.0.0.0:50051
      RUST_LOG: info
    ports:
      - "50051:50051"
    restart: unless-stopped

  rust-api-gateway:
    profiles: ["rust-backend", "rust-only"]
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-api-gateway
    container_name: universus_rust_api_gateway
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rust-core-engine:
        condition: service_started
    ports:
      - "3300:3000"
    restart: unless-stopped

  rust-admin-api:
    profiles: ["rust-backend", "rust-only"]
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-admin-api
    container_name: universus_rust_admin_api
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "4302:4002"
    restart: unless-stopped

  rust-bot-api:
    profiles: ["rust-backend", "rust-only"]
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-bot-api
    container_name: universus_rust_bot_api
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "4301:4001"
    restart: unless-stopped

  rust-sms-api:
    profiles: ["rust-backend", "rust-only"]
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-sms-api
    container_name: universus_rust_sms_api
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "4303:4003"
    restart: unless-stopped

  rust-realtime-gateway:
    profiles: ["rust-backend", "rust-only"]
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-realtime-gateway
    container_name: universus_rust_realtime_gateway
    depends_on:
      redis:
        condition: service_healthy
      rust-core-engine:
        condition: service_started
    ports:
      - "4304:4004"
    restart: unless-stopped

  rust-core-engine:
    profiles: ["rust-backend", "rust-only"]
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: backend-core
    container_name: universus_rust_core_engine
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CORE_BIND_ADDR: 0.0.0.0:50051
    ports:
      - "50051:50051"
    restart: unless-stopped

  admin-service:
    build:
      context: ./backend-admin-service
      dockerfile: Dockerfile
    container_name: universus_admin_service
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ADMIN_PORT: 4002
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: universus_rpg
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change_this_to_a_secure_random_string_in_production
    ports:
      - "4002:4002"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: universus_frontend
    depends_on:
      backend:
        condition: service_started
        required: false
      rust-api-gateway:
        condition: service_started
        required: false
    ports:
      - "8080:80"
    restart: unless-stopped

  prometheus:
    build:
      context: ./observability-service
      dockerfile: Dockerfile.prometheus
    container_name: universus_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability-service/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend
      - node-exporter
      - blackbox-exporter

  grafana:
    build:
      context: ./observability-service
      dockerfile: Dockerfile.grafana
    container_name: universus_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  alertmanager:
    image: prom/alertmanager:latest
    container_name: universus_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability-service/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  node-exporter:
    image: prom/node-exporter:latest
    container_name: universus_node_exporter
    ports:
      - "9100:9100"

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: universus_blackbox_exporter
    ports:
      - "9115:9115"
    volumes:
      - ./observability-service/blackbox.yml:/etc/blackbox_exporter/config.yml

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: universus_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability-service/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
