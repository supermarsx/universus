x-runtime-environment: &runtime-environment
  UNIVERSUS_ENV: production

x-auth-verifier-environment: &auth-verifier-environment
  <<: *runtime-environment
  AUTH_ALLOW_LEGACY_HS256: "false"
  AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.universus.internal}
  AUTH_JWT_VERIFICATION_KEYS: ${AUTH_JWT_VERIFICATION_KEYS:?AUTH_JWT_VERIFICATION_KEYS must contain kid:base64url-public-key entries}

x-database-dependencies: &database-dependencies
  database:
    condition: service_healthy
  database-migrate:
    condition: service_completed_successfully

services:
  database:
    image: universus-database:local
    build:
      context: ./database
    container_name: universus_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-universus_rpg}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(head -n 1 /var/lib/postgresql/data/postmaster.pid)\" = \"1\" && pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  database-migrate:
    image: universus-database:local
    build:
      context: ./database
    container_name: universus_database_migrate
    entrypoint: ["/opt/universus/database/scripts/migrate-db.sh"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-universus_rpg}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      MIGRATION_WAIT_SECONDS: ${MIGRATION_WAIT_SECONDS:-60}
      MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-120}
    restart: "no"

  redis:
    build:
      context: ./redis
    container_name: universus_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    build:
      context: ./rabbitmq
    container_name: universus_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: universus
      RABBITMQ_DEFAULT_PASS: universus
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5


  rust-api-gateway:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-api-gateway
    container_name: universus_rust_api_gateway
    depends_on:
      <<: *database-dependencies
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rust-core-engine:
        condition: service_started
    environment:
      <<: *auth-verifier-environment
      AUTH_EXPECTED_AUDIENCE: app-api-gateway
      AUTH_TOKEN_ISSUER: "true"
      AUTH_TOKEN_AUDIENCES: app-api-gateway,app-web-frontend,app-admin-api,app-bot-api,app-realtime-gateway
      AUTH_JWT_SIGNING_KEY_ID: ${AUTH_JWT_SIGNING_KEY_ID:?AUTH_JWT_SIGNING_KEY_ID must select the active signing key}
      AUTH_JWT_PRIVATE_KEY_BASE64: ${AUTH_JWT_PRIVATE_KEY_BASE64:?AUTH_JWT_PRIVATE_KEY_BASE64 must be provisioned only to rust-api-gateway}
      PLATFORM_EVENTS_SERVICE_TOKEN: ${API_GATEWAY_REALTIME_PUBLISH_TOKEN:?API_GATEWAY_REALTIME_PUBLISH_TOKEN requires aud=app-realtime-gateway and scope=realtime.publish}
      RUST_LOG: info
      DATABASE_URL: "${DATABASE_URL_INTERNAL:?DATABASE_URL_INTERNAL must use the database service host}"
      REALTIME_GATEWAY_URL: http://rust-realtime-gateway:4004
    ports:
      - "3300:3000"
    restart: unless-stopped

  rust-web-frontend:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-web-frontend
    container_name: universus_rust_web_frontend
    depends_on:
      rust-api-gateway:
        condition: service_started
    environment:
      <<: *auth-verifier-environment
      AUTH_EXPECTED_AUDIENCE: app-web-frontend
      PORT: 3005
      API_GATEWAY_URL: http://rust-api-gateway:3000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UNIVERSUS_ALLOW_INSECURE_LOCAL_HTTP_COOKIE: ${UNIVERSUS_ALLOW_INSECURE_LOCAL_HTTP_COOKIE:-false}
    ports:
      - "8080:3005"
    restart: unless-stopped

  rust-admin-api:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-admin-api
    container_name: universus_rust_admin_api
    depends_on:
      <<: *database-dependencies
    environment:
      <<: *auth-verifier-environment
      AUTH_EXPECTED_AUDIENCE: app-admin-api
      RUST_LOG: info
      DATABASE_URL: "${DATABASE_URL_INTERNAL:?DATABASE_URL_INTERNAL must use the database service host}"
    ports:
      - "4302:4002"
    restart: unless-stopped

  rust-bot-api:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-bot-api
    container_name: universus_rust_bot_api
    depends_on:
      <<: *database-dependencies
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *auth-verifier-environment
      AUTH_EXPECTED_AUDIENCE: app-bot-api
      RUST_LOG: info
      DATABASE_URL: "${DATABASE_URL_INTERNAL:?DATABASE_URL_INTERNAL must use the database service host}"
    ports:
      - "4301:4001"
    restart: unless-stopped

  rust-bot-worker:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-bot-worker
    container_name: universus_rust_bot_worker
    depends_on:
      rust-bot-api:
        condition: service_started
    environment:
      <<: *runtime-environment
      RUST_LOG: info
      BOT_API_URL: http://rust-bot-api:4001
      BOT_WORKER_SERVICE_TOKEN: ${BOT_WORKER_SERVICE_TOKEN:?BOT_WORKER_SERVICE_TOKEN requires aud=app-bot-api and scope=bot.process}
      PLATFORM_EVENTS_SERVICE_TOKEN: ${BOT_WORKER_REALTIME_PUBLISH_TOKEN:?BOT_WORKER_REALTIME_PUBLISH_TOKEN requires aud=app-realtime-gateway and scope=realtime.publish}
      REALTIME_GATEWAY_URL: http://rust-realtime-gateway:4004
      BOT_WORKER_INTERVAL_MS: 60000
    restart: unless-stopped

  rust-sms-api:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-sms-api
    container_name: universus_rust_sms_api
    depends_on:
      <<: *database-dependencies
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      RUST_LOG: info
      DATABASE_URL: "${DATABASE_URL_INTERNAL:?DATABASE_URL_INTERNAL must use the database service host}"
    ports:
      - "4303:4003"
    restart: unless-stopped

  rust-email-worker:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-email-worker
    container_name: universus_rust_email_worker
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      PLATFORM_EVENTS_SERVICE_TOKEN: ${EMAIL_WORKER_REALTIME_PUBLISH_TOKEN:?EMAIL_WORKER_REALTIME_PUBLISH_TOKEN requires aud=app-realtime-gateway and scope=realtime.publish}
      REALTIME_GATEWAY_URL: http://rust-realtime-gateway:4004
      RUST_LOG: info
      REDIS_URL: redis://redis:6379
      WORKER_INTERVAL_SECONDS: 10
      EMAIL_QUEUE_NAME: email.outbound
      EMAIL_DLQ_NAME: email.dead-letter
    restart: unless-stopped

  rust-analytics-worker:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-analytics-worker
    container_name: universus_rust_analytics_worker
    depends_on:
      <<: *database-dependencies
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      PLATFORM_EVENTS_SERVICE_TOKEN: ${ANALYTICS_WORKER_REALTIME_PUBLISH_TOKEN:?ANALYTICS_WORKER_REALTIME_PUBLISH_TOKEN requires aud=app-realtime-gateway and scope=realtime.publish}
      REALTIME_GATEWAY_URL: http://rust-realtime-gateway:4004
      RUST_LOG: info
      DATABASE_URL: "${DATABASE_URL_INTERNAL:?DATABASE_URL_INTERNAL must use the database service host}"
      RABBITMQ_URL: amqp://universus:universus@rabbitmq:5672
      WORKER_INTERVAL_SECONDS: 10
      ANALYTICS_BATCH_SIZE: 100
    restart: unless-stopped

  rust-realtime-gateway:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-realtime-gateway
    container_name: universus_rust_realtime_gateway
    depends_on:
      <<: *database-dependencies
      redis:
        condition: service_healthy
      rust-core-engine:
        condition: service_started
    environment:
      <<: *auth-verifier-environment
      AUTH_EXPECTED_AUDIENCE: app-realtime-gateway
      RUST_LOG: info
      PORT: 4004
      DATABASE_URL: "${DATABASE_URL_INTERNAL:?DATABASE_URL_INTERNAL must use the database service host}"
      REDIS_URL: redis://redis:6379
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:?REALTIME_ALLOWED_ORIGINS must list trusted browser origins}
    ports:
      - "4304:4004"
    restart: unless-stopped

  rust-core-engine:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: backend-core
    container_name: universus_rust_core_engine
    depends_on:
      <<: *database-dependencies
      redis:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      CORE_BIND_ADDR: 0.0.0.0:50051
    ports:
      - "50051:50051"
    restart: unless-stopped

  rust-app-core-engine:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-core-engine
    container_name: universus_rust_app_core_engine
    depends_on:
      <<: *database-dependencies
      rust-realtime-gateway:
        condition: service_started
    environment:
      <<: *runtime-environment
      PLATFORM_EVENTS_SERVICE_TOKEN: ${CORE_ENGINE_REALTIME_PUBLISH_TOKEN:?CORE_ENGINE_REALTIME_PUBLISH_TOKEN requires aud=app-realtime-gateway and scope=realtime.publish}
      RUST_LOG: info
      DATABASE_URL: "${DATABASE_URL_INTERNAL:?DATABASE_URL_INTERNAL must use the database service host}"
      REALTIME_GATEWAY_URL: http://rust-realtime-gateway:4004
    ports:
      - "4307:3007"
    restart: unless-stopped

  rust-notifications-worker:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-notifications-worker
    container_name: universus_rust_notifications_worker
    depends_on:
      <<: *database-dependencies
      rust-realtime-gateway:
        condition: service_started
    environment:
      <<: *runtime-environment
      PLATFORM_EVENTS_SERVICE_TOKEN: ${NOTIFICATIONS_WORKER_REALTIME_PUBLISH_TOKEN:?NOTIFICATIONS_WORKER_REALTIME_PUBLISH_TOKEN requires aud=app-realtime-gateway and scope=realtime.publish}
      RUST_LOG: info
      DATABASE_URL: "${DATABASE_URL_INTERNAL:?DATABASE_URL_INTERNAL must use the database service host}"
      REALTIME_GATEWAY_URL: http://rust-realtime-gateway:4004
      NOTIFICATION_CLEANUP_INTERVAL_SECS: 900
      NOTIFICATION_RETENTION_DAYS: 30
      NOTIFICATION_ARCHIVE_GRACE_DAYS: 7
    restart: unless-stopped

  rust-chat-worker:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-chat-worker
    container_name: universus_rust_chat_worker
    depends_on:
      <<: *database-dependencies
      rust-realtime-gateway:
        condition: service_started
    environment:
      <<: *runtime-environment
      PLATFORM_EVENTS_SERVICE_TOKEN: ${CHAT_WORKER_REALTIME_PUBLISH_TOKEN:?CHAT_WORKER_REALTIME_PUBLISH_TOKEN requires aud=app-realtime-gateway and scope=realtime.publish}
      RUST_LOG: info
      DATABASE_URL: "${DATABASE_URL_INTERNAL:?DATABASE_URL_INTERNAL must use the database service host}"
      REALTIME_GATEWAY_URL: http://rust-realtime-gateway:4004
      CHAT_CLEANUP_INTERVAL_SECS: 300
    restart: unless-stopped

  rust-scheduler-worker:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-scheduler-worker
    container_name: universus_rust_scheduler_worker
    depends_on:
      <<: *database-dependencies
      rust-realtime-gateway:
        condition: service_started
    environment:
      <<: *runtime-environment
      PLATFORM_EVENTS_SERVICE_TOKEN: ${SCHEDULER_WORKER_REALTIME_PUBLISH_TOKEN:?SCHEDULER_WORKER_REALTIME_PUBLISH_TOKEN requires aud=app-realtime-gateway and scope=realtime.publish}
      RUST_LOG: info
      DATABASE_URL: "${DATABASE_URL_INTERNAL:?DATABASE_URL_INTERNAL must use the database service host}"
      REALTIME_GATEWAY_URL: http://rust-realtime-gateway:4004
      GAME_LOOP_INTERVAL_SECS: 5
      FLEET_SCHEDULER_INTERVAL_SECS: 10
      MOON_DESTROY_INTERVAL_SECS: 10
      SHARD_HEALTH_INTERVAL_SECS: 60
      SCHED_TASK_LEASE_SECS: 30
      SCHED_TASK_RETRY_DELAY_SECS: 15
      SCHED_TASK_MAX_ATTEMPTS: 3
    restart: unless-stopped

  rust-sharding-worker:
    build:
      context: .
      dockerfile: crates/Dockerfile.service
      args:
        BIN_NAME: app-sharding-worker
    container_name: universus_rust_sharding_worker
    depends_on:
      <<: *database-dependencies
      rust-realtime-gateway:
        condition: service_started
    environment:
      <<: *runtime-environment
      PLATFORM_EVENTS_SERVICE_TOKEN: ${SHARDING_WORKER_REALTIME_PUBLISH_TOKEN:?SHARDING_WORKER_REALTIME_PUBLISH_TOKEN requires aud=app-realtime-gateway and scope=realtime.publish}
      RUST_LOG: info
      DATABASE_URL: "${DATABASE_URL_INTERNAL:?DATABASE_URL_INTERNAL must use the database service host}"
      REALTIME_GATEWAY_URL: http://rust-realtime-gateway:4004
      SERVER_ID: rust-shard-1
      SERVER_TYPE: game
      SERVER_REGION: global
      SERVER_ENDPOINT: http://rust-api-gateway:3000
      SHARD_HEARTBEAT_INTERVAL_SECS: 30
      SHARD_STALE_CHECK_INTERVAL_SECS: 60
      SHARD_STALE_AFTER_SECS: 120
      SHARD_MESSAGE_LEASE_SECS: 30
      SHARD_MESSAGE_RETRY_DELAY_SECS: 15
      SHARD_MESSAGE_MAX_ATTEMPTS: 3
    restart: unless-stopped


  prometheus:
    build:
      context: ./observability-service
      dockerfile: Dockerfile.prometheus
    container_name: universus_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability-service/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - rust-api-gateway
      - node-exporter
      - blackbox-exporter

  grafana:
    build:
      context: ./observability-service
      dockerfile: Dockerfile.grafana
    container_name: universus_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  alertmanager:
    image: prom/alertmanager:latest
    container_name: universus_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability-service/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  node-exporter:
    image: prom/node-exporter:latest
    container_name: universus_node_exporter
    ports:
      - "9100:9100"

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: universus_blackbox_exporter
    ports:
      - "9115:9115"
    volumes:
      - ./observability-service/blackbox.yml:/etc/blackbox_exporter/config.yml

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: universus_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability-service/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
