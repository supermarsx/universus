name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install root dependencies
        run: pnpm install

      - name: Lint backend
        run: pnpm --filter ./backend... run lint

      - name: Build backend
        run: pnpm --filter ./backend... run build

      - name: Test backend
        run: pnpm --filter ./backend... run test

      - name: Lint backend-admin-service
        run: pnpm --filter ./backend-admin-service... run lint

      - name: Build backend-admin-service
        run: pnpm --filter ./backend-admin-service... run build

      - name: Test backend-admin-service
        run: pnpm --filter ./backend-admin-service... run test

      - name: Lint backend-bot-service
        run: pnpm --filter ./backend-bot-service... run lint

      - name: Build backend-bot-service
        run: pnpm --filter ./backend-bot-service... run build

      - name: Test backend-bot-service
        run: pnpm --filter ./backend-bot-service... run test

      - name: Lint frontend
        run: pnpm --filter ./frontend... run lint

      - name: Build frontend
        run: pnpm --filter ./frontend... run build

      - name: Test frontend
        run: pnpm --filter ./frontend... run test

      - name: Lint email-delivery-service
        run: pnpm --filter ./email-delivery-service... run lint

      - name: Build email-delivery-service
        run: pnpm --filter ./email-delivery-service... run build

      - name: Test email-delivery-service
        run: pnpm --filter ./email-delivery-service... run test

      # Optionally, build Docker images for each service
      - name: Build Docker images
        run: |
          docker build -t universus-backend ./backend
          docker build -t universus-backend-admin ./backend-admin-service
          docker build -t universus-backend-bot ./backend-bot-service
          docker build -t universus-frontend ./frontend
          docker build -t universus-email ./email-delivery-service
        if: always()
