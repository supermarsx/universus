name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install root dependencies
        run: pnpm install

      - name: Install backend dependencies
        run: pnpm --dir backend install

      - name: Install backend-admin-service dependencies
        run: pnpm --dir backend-admin-service install

      - name: Install backend-bot-service dependencies
        run: pnpm --dir backend-bot-service install

      - name: Install frontend dependencies
        run: pnpm --dir frontend install

      - name: Install email-delivery-service dependencies
        run: pnpm --dir email-delivery-service install

      - name: Lint backend
        run: pnpm --dir backend run lint

      - name: Build backend
        run: pnpm --dir backend run build

      - name: Test backend
        run: pnpm --dir backend run test

      - name: Lint backend-admin-service
        run: pnpm --dir backend-admin-service run lint

      - name: Build backend-admin-service
        run: pnpm --dir backend-admin-service run build

      - name: Test backend-admin-service
        run: pnpm --dir backend-admin-service run test

      - name: Lint backend-bot-service
        run: pnpm --dir backend-bot-service run lint

      - name: Build backend-bot-service
        run: pnpm --dir backend-bot-service run build

      - name: Test backend-bot-service
        run: pnpm --dir backend-bot-service run test

      - name: Lint frontend
        run: pnpm --dir frontend run lint

      - name: Build frontend
        run: pnpm --dir frontend run build

      - name: Test frontend
        run: pnpm --dir frontend run test

      - name: Lint email-delivery-service
        run: pnpm --dir email-delivery-service run lint

      - name: Build email-delivery-service
        run: pnpm --dir email-delivery-service run build

      - name: Test email-delivery-service
        run: pnpm --dir email-delivery-service run test

      # Optionally, build Docker images for each service
      - name: Build Docker images
        run: |
          docker build -t universus-backend ./backend
          docker build -t universus-backend-admin ./backend-admin-service
          docker build -t universus-backend-bot ./backend-bot-service
          docker build -t universus-frontend ./frontend
          docker build -t universus-email ./email-delivery-service
        if: always()

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install backend dependencies
        run: pnpm --dir backend install

      - name: Apply database schema and run sanity checks
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: testdb
        run: |
          chmod +x database/scripts/migrate-test-db.sh
          database/scripts/migrate-test-db.sh

      - name: Run backend integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/testdb
        run: |
          RUN_INTEGRATION=true pnpm --dir backend run test:integration
