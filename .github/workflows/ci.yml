name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo check workspace
        run: cargo check --workspace

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run targeted parity tests
        run: |
          cargo test -p app-web-frontend all_template_routes_have_expected_auth_gating_and_render -- --nocapture
          cargo test -p app-api-gateway --test routes debris_extended_parity_endpoints_return_expected_contracts -- --nocapture
          cargo test -p app-api-gateway --test routes shards_extended_endpoints_return_expected_contracts -- --nocapture

      - name: Cutover validation
        run: pwsh -NoProfile -File scripts/rust/run-cutover-validation.ps1

  rust-integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Apply database migrations
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: testdb
        run: |
          chmod +x database/scripts/migrate-test-db.sh
          database/scripts/migrate-test-db.sh

      - name: Run Rust integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/testdb
        run: |
          cargo test -p app-api-gateway notifications_high_volume_create_flow_stays_consistent -- --nocapture
          cargo test -p app-api-gateway sharding_registration_churn_keeps_routing_stats_coherent -- --nocapture
