name: backend-core CI

on:
  push:
    paths:
      - 'crates/backend-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/backend-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust
        uses: actions/setup-rust@v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo fmt
        run: cargo fmt --manifest-path crates/backend-core/Cargo.toml -- --check
      - name: Build backend-core
        run: cargo build --manifest-path crates/backend-core/Cargo.toml --release
      - name: Run backend-core tests
        run: cargo test --manifest-path crates/backend-core/Cargo.toml


  node-tests:
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd backend
          npm ci
      - name: Run unit tests
        run: |
          cd backend
          npm test --silent
