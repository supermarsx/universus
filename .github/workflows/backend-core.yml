name: backend-core CI

on:
  push:
    paths:
      - 'backend-core/**'
      - 'backend/**'
  pull_request:
    paths:
      - 'backend-core/**'
      - 'backend/**'

jobs:
  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --manifest-path backend-core/Cargo.toml --release
      - name: Run Rust tests
        run: cargo test --manifest-path backend-core/Cargo.toml

  node-tests:
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd backend
          npm ci
      - name: Run unit tests
        run: |
          cd backend
          npm test --silent
