[package]
name = "app-email-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
adapter-provider-email = { path = "../adapter-provider-email" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
platform-observability = { path = "../platform-observability" }
platform-auth = { path = "../platform-auth" }
platform-db = { path = "../platform-db" }
zeroize = "1.8"
