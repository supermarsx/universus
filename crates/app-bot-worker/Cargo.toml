[package]
name = "app-bot-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
platform-auth = { path = "../platform-auth" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
platform-worker-runtime = { path = "../platform-worker-runtime" }
platform-tenancy = { path = "../platform-tenancy" }
platform-events = { path = "../platform-events" }
platform-observability = { path = "../platform-observability" }
