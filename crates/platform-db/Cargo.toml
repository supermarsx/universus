[package]
name = "platform-db"
version = "0.1.0"
edition = "2021"

[dependencies]
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
serde_json = "1"
game-economy = { path = "../game-economy" }
game-combat = { path = "../game-combat" }
game-fleet = { path = "../game-fleet" }
game-moon = { path = "../game-moon" }
base64 = "0.22"
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.8"

[dev-dependencies]
tokio = { workspace = true }
