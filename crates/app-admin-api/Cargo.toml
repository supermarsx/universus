[package]
name = "app-admin-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { workspace = true }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
platform-adapter = { path = "../platform-adapter" }
platform-auth = { path = "../platform-auth" }
platform-consensus = { path = "../platform-consensus" }
platform-db = { path = "../platform-db" }
platform-migrations = { path = "../platform-migrations" }
platform-tenancy = { path = "../platform-tenancy" }
serde = { workspace = true }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
hyper = "0.14"
tower = "0.4"
tokio-postgres = "0.7"
