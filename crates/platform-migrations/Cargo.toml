[package]
name = "platform-migrations"
version = "0.1.0"
edition = "2021"

[dependencies]
adapter-db = { path = "../adapter-db" }
anyhow = "1"
platform-consensus = { path = "../platform-consensus" }
platform-tenancy = { path = "../platform-tenancy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
