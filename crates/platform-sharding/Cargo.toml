[package]
name = "platform-sharding"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1"
platform-consensus = { path = "../platform-consensus" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "1"
tracing = "0.1"
