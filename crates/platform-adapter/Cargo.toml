[package]
name = "platform-adapter"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1"
thiserror = "1"
platform-consensus = { path = "../platform-consensus" }
platform-tenancy = { path = "../platform-tenancy" }
adapter-db = { path = "../adapter-db" }
tokio-postgres = "0.7"
serde_json = "1"
