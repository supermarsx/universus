[package]
name = "platform-scheduler"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "1"
tracing = "0.1"
platform-common = { path = "../platform-common" }
platform-tenant-routing = { path = "../platform-tenant-routing" }
platform-sharding = { path = "../platform-sharding" }
platform-tenancy = { path = "../platform-tenancy" }

[dev-dependencies]
platform-consensus = { path = "../platform-consensus" }
serde_json = "1"
