[package]
name = "adapter-db"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-0_8"] }
log = "0.4"
async-trait = "0.1"
mysql_async = "0.33"
rusqlite = { version = "0.31", features = ["bundled"] }
[dev-dependencies]
testcontainers = "0.17"
